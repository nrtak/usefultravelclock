name: Upload to TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      TEAM_ID: R3233N87DC
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare signing
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROFILE: ${{ secrets.APP_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROFILE: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APP_PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$WIDGET_PROFILE" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"
          for kind in app widget; do
            security cms -D -i "$RUNNER_TEMP/$kind.mobileprovision" > "$RUNNER_TEMP/$kind.plist"
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$kind.plist")
            cp "$RUNNER_TEMP/$kind.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          done
      - name: Generate signed project
        run: |
          python3 scripts/prepare-release.py
          xcodegen generate --spec project-release.yml
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project UsefulTravelClock.xcodeproj -scheme UsefulTravelClock \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/UsefulTravelClock.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" MARKETING_VERSION=1.0 \
            archive | tee archive.log
      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/UsefulTravelClock.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export"
      - name: Upload to App Store Connect
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/UsefulTravelClock.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build-log
          path: archive.log
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/widget.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8
